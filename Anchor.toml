[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
memebet_arena = "6fQsRy2d91RaaHZrd9ymmaQuR4bWDL7x5hD6WqpdgLMV"

[programs.devnet]
memebet_arena = "6fQsRy2d91RaaHZrd9ymmaQuR4bWDL7x5hD6WqpdgLMV"

[programs.mainnet]
memebet_arena = "6fQsRy2d91RaaHZrd9ymmaQuR4bWDL7x5hD6WqpdgLMV"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet = "~/.config/solana/id.json"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
